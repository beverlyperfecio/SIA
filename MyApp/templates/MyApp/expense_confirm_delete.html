<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Expense - Daily Expense Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 600px;
            margin: 80px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #dc2626;
        }

        .expense-name {
            font-size: 20px;
            font-weight: bold;
        }

        .amount {
            color: #dc2626;
            font-weight: bold;
        }

        .buttons {
            margin-top: 25px;
        }

        button,
        a {
            display: inline-block;
            padding: 11px 18px;
            border-radius: 8px;
            text-decoration: none;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            font-size: 15px;
        }

        button {
            background: #dc2626;
            color: white;
        }

        button:hover {
            background: #b91c1c;
        }

        a {
            background: #e5e7eb;
            color: #111827;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Delete Expense</h1>

            <p>
                Are you sure you want to delete this expense?
            </p>

            <p class="expense-name">
                {{ expense.expense_name }}
            </p>

            <p>
                Amount:
                <span class="amount">
                    ₱{{ expense.amount|floatformat:2 }}
                </span>
            </p>

            <form method="POST">

                {% csrf_token %}

                <div class="buttons">

                    <button type="submit">
                        Yes, Delete
                    </button>

                    <a href="{% url 'expense_list' %}">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
